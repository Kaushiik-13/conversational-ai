version: 1
model: automotive_catalog
description: >-
  Read-only analytics model for catalog parts. This file is a reviewed semantic
  definition; it does not execute queries or establish authorization.

source:
  engine: postgresql
  schema: catalog
  table: part_catalog
  alias: part
  grain: one row per catalog part

authorization:
  organization_context: authenticated_server_session
  enforcement: existing_database_row_level_security
  require_permission: catalog.read
  never_accept_organization_from_question: true
  never_expose_as_query_fields:
    - id
    - company_id
    - tenant_id
    - security_domain_id
    - visibility_status
    - source_system
    - source_record_id

measures:
  part_count:
    description: Number of distinct catalog parts visible to the authenticated user.
    aggregation: count_distinct
    expression: part.id
  manufacturer_count:
    description: Number of distinct manufacturers represented in visible catalog parts.
    aggregation: count_distinct
    expression: part.manufacturer
  total_cost_usd:
    description: Sum of recorded part costs in US dollars.
    aggregation: sum
    expression: part.cost_usd
    access: { resource_type: catalog.part, field_name: costUsd }
  average_cost_usd:
    description: Average recorded part cost in US dollars.
    aggregation: average
    expression: part.cost_usd
    access: { resource_type: catalog.part, field_name: costUsd }
  min_cost_usd:
    description: Lowest recorded part cost in US dollars.
    aggregation: minimum
    expression: part.cost_usd
    access: { resource_type: catalog.part, field_name: costUsd }
  max_cost_usd:
    description: Highest recorded part cost in US dollars.
    aggregation: maximum
    expression: part.cost_usd
    access: { resource_type: catalog.part, field_name: costUsd }
  total_weight_kg:
    description: Sum of recorded part weights in kilograms.
    aggregation: sum
    expression: part.weight_kg
  average_weight_kg:
    description: Average recorded part weight in kilograms.
    aggregation: average
    expression: part.weight_kg
  min_weight_kg:
    description: Lowest recorded part weight in kilograms.
    aggregation: minimum
    expression: part.weight_kg
  max_weight_kg:
    description: Highest recorded part weight in kilograms.
    aggregation: maximum
    expression: part.weight_kg

dimensions:
  manufacturer:
    description: Component manufacturer recorded on the catalog part.
    expression: part.manufacturer
    type: string
    groupable: true
    filterable: true
    aliases: [maker, brand, manufacturer name, made by]
  commodity:
    description: Top-level commodity classification.
    expression: part.commodity
    type: string
    groupable: true
    filterable: true
    known_values:
      - ADAS
      - Battery
      - Body
      - Braking
      - Electrical
      - Engine
      - Interior
      - Safety
      - Steering
      - Suspension
      - Thermal
      - Transmission
      - Tyres and Wheels
    synonyms:
      brake parts: Braking
      brake components: Braking
      braking components: Braking
  sub_commodity:
    description: More specific commodity classification.
    expression: part.sub_commodity
    type: string
    groupable: true
    filterable: true
    aliases: [sub commodity, sub-commodity, product type, part type]
  vehicle_program:
    description: Vehicle program associated with the part; this is not a vehicle make.
    expression: part.vehicle_program
    type: string
    groupable: true
    filterable: true
    aliases: [vehicle program, vehicle project, program]
  region:
    description: Region associated with the part record.
    expression: part.region
    type: string
    groupable: true
    filterable: true
    aliases: [region, geography, market region]
    known_values:
      - Africa
      - Asia
      - Europe
      - Middle East
      - North America
      - Oceania
      - South America
  country:
    description: Country associated with the part record.
    expression: part.country
    type: string
    groupable: true
    filterable: true
    aliases: [country, nation]
  plant:
    description: Plant associated with the part record.
    expression: part.plant
    type: string
    groupable: true
    filterable: true
    aliases: [plant, factory, facility]
  model_year:
    description: Model year associated with the part record.
    expression: part.model_year
    type: integer
    groupable: true
    filterable: true
    aliases: [model year, model-year, vehicle year]
  lifecycle_status:
    description: Lifecycle status recorded on the part.
    expression: part.lifecycle_status
    type: string
    groupable: true
    filterable: true
    known_values:
      - active
      - prototype
      - superseded
      - obsolete
      - end-of-life
  active:
    description: Whether the catalog record is active.
    expression: part.active
    type: boolean
    groupable: true
    filterable: true
  material:
    description: Material recorded for the catalog part.
    expression: part.material
    type: string
    groupable: true
    filterable: true
    aliases: [material, made of, material type]
  supplier_status:
    description: Supplier status recorded for the catalog part.
    expression: part.supplier_status
    access: { resource_type: catalog.part, field_name: supplierStatus }
    type: string
    groupable: true
    filterable: true
    aliases: [supplier status, supplier state]
  cost_usd:
    description: Recorded part cost in US dollars. This is a catalog value, not a live quote.
    expression: part.cost_usd
    access: { resource_type: catalog.part, field_name: costUsd }
    type: number
    groupable: true
    filterable: true
    aliases: [cost, price in dollars, cost in usd]
  weight_kg:
    description: Recorded part weight in kilograms.
    expression: part.weight_kg
    type: number
    groupable: true
    filterable: true
    aliases: [weight, mass, weight in kilograms]
  document_version:
    description: Version number of the source catalog document.
    expression: part.document_version
    type: integer
    groupable: true
    filterable: true
    aliases: [document version, source version]
  category:
    description: Catalog category assigned to the part.
    expression: category.name
    type: string
    groupable: true
    filterable: true
    filter_expression: category.slug
    filter_behavior: match_selected_category_and_descendants
    known_values:
      - brake-pads
    synonyms:
      brake pad: brake-pads
      brake pads: brake-pads
      brake-pad: brake-pads
    join:
      table: catalog.part_categories
      alias: part_category
      on: part_category.part_id = part.id
      target_table: catalog.categories
      target_alias: category
      target_on: category.id = part_category.category_id
      cardinality: many_to_many
      measure_rule: count_distinct_part_id

lookup_fields:
  part_number:
    expression: part.part_number
    filterable: true
    groupable: false
    aliases: [part number, part no, sku]
  part_name:
    description: Name or partial text in the catalog part name.
    expression: part.part_name
    filterable: true
    groupable: false
    aliases: [part name, name]
  description:
    description: Text recorded in the part description; use contains for text searches.
    expression: part.description
    filterable: true
    groupable: false
    aliases: [description, details, text]
  created_at:
    description: When the catalog record was created; use an ISO date or timestamp.
    expression: part.created_at
    type: timestamp
    filterable: true
    groupable: false
    aliases: [created, creation date, added on]
  updated_at:
    description: When the catalog record was last updated; use an ISO date or timestamp.
    expression: part.updated_at
    type: timestamp
    filterable: true
    groupable: false
    aliases: [updated, last updated, modified on]

record_fields:
  part_number: { description: Catalog part number, type: string }
  part_name: { description: Catalog part name, type: string }
  description: { description: Catalog part description, type: string }
  commodity: { description: Top-level commodity, type: string }
  sub_commodity: { description: More specific commodity, type: string }
  manufacturer: { description: Component manufacturer, type: string }
  vehicle_program: { description: Associated vehicle program, type: string }
  region: { description: Region on the catalog record, type: string }
  country: { description: Country on the catalog record, type: string }
  plant: { description: Plant on the catalog record, type: string }
  model_year: { description: Associated model year, type: integer }
  material: { description: Recorded part material, type: string }
  lifecycle_status: { description: Part lifecycle status, type: string }
  supplier_status:
    {
      description: Supplier status,
      type: string,
      access: { resource_type: catalog.part, field_name: supplierStatus },
    }
  cost_usd:
    {
      description: Recorded cost in US dollars,
      type: number,
      access: { resource_type: catalog.part, field_name: costUsd },
    }
  weight_kg: { description: Recorded weight in kilograms, type: number }
  active: { description: Whether the catalog record is active, type: boolean }
  document_version: { description: Source document version, type: integer }
  created_at:
    { description: When the catalog record was created, type: timestamp }
  updated_at:
    { description: When the catalog record was last updated, type: timestamp }
  category: { description: Categories assigned to the part, type: "string[]" }

excluded_fields:
  - tenant_id
  - company_id
  - security_domain_id
  - visibility_status
  - source_system
  - source_record_id
  - id
  - primary_category_id

limits:
  max_dimensions_per_query: 5
  max_filters_per_query: 15
  default_result_limit: 50
  max_result_limit: 500
  max_record_fields: 25
  max_record_rows: 100
  read_only: true
